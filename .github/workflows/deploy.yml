# Build Astro puis déploiement sur GitHub Pages : https://pantheon.stylz.fr/
# Seul le dossier dist/ (le site construit) est publié sur Pages.
# Prérequis (une fois), dans Settings → Pages :
#   - Build and deployment → Source : « GitHub Actions »
#   - Custom domain : pantheon.stylz.fr (+ Enforce HTTPS)
# DNS (FreeDNS) : enregistrement A  pantheon.stylz.fr  →  185.199.108.153 (GitHub Pages).
name: Déploiement GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un push plus récent annule le précédent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configuration Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        # Sans l'espace client : GitHub Pages n'a pas de fonctions serveur pour le protéger.
        run: npm run build:github-pages
        env:
          # Préfixe des URL selon la config Pages : vide avec le domaine personnalisé,
          # « /pantheon » sans (voir astro.config.mjs).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
